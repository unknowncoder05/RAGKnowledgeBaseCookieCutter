[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-ai"
version = "0.1.0"
description = "ProjectMaker shared AI integration utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "openai>=1.0.0",
    "anthropic>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pm_ai*"]
